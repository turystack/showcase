name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm check

      # `build` runs `prebuild` first, and prebuild is the gates: the linked
      # packages are the build on disk, the skill docs evaluate, and every
      # library route has a card. They only ever ran by hand until now.
      - name: Gates and build
        run: pnpm build
