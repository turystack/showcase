name: Deploy to GitHub Pages

# The site depends on sibling packages by `file:../react-web` and friends, which
# do not exist on a runner, so the build cannot happen here. `pnpm site:write`
# builds locally — gates, tsc and vite — and commits the output to `site/`;
# this workflow only publishes that folder.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
